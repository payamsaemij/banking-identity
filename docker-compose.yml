# Runs the Identity service against the shared PostgreSQL managed by
# ../banking-infrastructure. The database is deliberately NOT redefined
# here: this project joins the infrastructure project's Docker network
# as an external network and reaches PostgreSQL by its container DNS
# name.
#
# Prerequisites:
#   1. ../banking-infrastructure is up (`docker compose up -d` there) —
#      it creates the shared `banking` network this file joins.
#   2. IDENTITY_DB_PASSWORD in this directory's .env matches the
#      banking_identity role created by the infrastructure init script.
#      It is used only to build the Docker-internal DATABASE_URL at
#      container start; it is never copied into the image (see
#      .dockerignore).
#
# Migrations are a deliberate, separate one-shot step — they never run on
# every startup and never race between replicas:
#   docker compose run --rm identity alembic upgrade head

services:
  identity:
    build: .
    image: banking-identity:latest
    container_name: banking-identity
    restart: unless-stopped
    env_file:
      - .env                # application settings; also supplies
                            # IDENTITY_DB_PASSWORD for the URL below
    environment:
      # Docker-internal DSN, pointed at the service's OWN database: the
      # host is the PostgreSQL container's DNS alias on the shared
      # network (never localhost — inside a container localhost is the
      # Identity container itself), the port is the in-network 5432, and
      # user/database are the dedicated banking_identity role. The
      # password has no default: the container refuses to start without
      # it rather than silently falling back to another database.
      DATABASE_URL: postgresql+psycopg://${IDENTITY_DB_USER:-banking_identity}:${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}@${IDENTITY_DB_HOST:-banking-postgres}:5432/${IDENTITY_DB_NAME:-banking_identity}
    ports:
      # Loopback-only, matching the banking-infrastructure convention;
      # drop this mapping entirely behind a reverse proxy in production.
      - "127.0.0.1:8000:8000"
    networks:
      - banking

networks:
  banking:
    # The one shared network of the local banking environment, created
    # and owned by ../banking-infrastructure. External: this file never
    # creates or modifies it — start the infrastructure first.
    name: banking
    external: true
